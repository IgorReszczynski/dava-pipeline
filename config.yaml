# Lecture Live configuration
# Runs fully offline: Whisper runs in whisper.cpp on the AMD GPU through Vulkan (no CUDA).
# Every key must be present. The app writes the choices made in its window back into this file.

# ASR Configuration (Whisper)
asr_backend: "whisper.cpp"         # the only engine: whisper.cpp built with GGML_VULKAN=1
asr_model: "large-v3-turbo-q8_0"   # loads <models_dir>/ggml-<asr_model>.bin
lang: ""                           # language code ("en", "de", "pl", ...); "" = Whisper detects it for every chunk
models_dir: "models"               # relative to this file
gpu_device: 0                      # Vulkan GPU index (0 = the Radeon 780M)
flash_attn: true
n_threads: 4                       # CPU threads for the parts of whisper.cpp that run on the CPU
beam_size: 5                       # 1 = greedy decoding
no_speech_thold: 1.0               # whisper.cpp discards a window's text when its no-speech probability is above this; 1.0 = never discard
use_context: true                  # give Whisper the transcript so far as its prompt
initial_prompt: ""                 # course vocabulary: names and terms Whisper should spell right

# Audio input
input_device: "Microphone Array (Realtek(R) Audio)"                   # microphone name; "" = the Windows default input
raw_capture: true                  # WASAPI raw mode: bypass Windows/driver mic effects (beamforming, noise suppression)
input_gain_db: 5.0                 # manual gain, applied to everything (meter, VAD, recording, Whisper)
agc: true                          # bring each chunk's speech level to agc_target_dbfs before Whisper
agc_target_dbfs: -20.0
agc_max_gain_db: 30.0
highpass_hz: 80.0                  # removes rumble below this (projector fans, footsteps); 0 = off

# Segmentation
segmentation: "vad"                # "vad": Silero VAD cuts at pauses and skips silence; "continuous": every second of audio goes to Whisper
vad_threshold: 0.35                # speech probability; lower catches quieter, more distant speech
vad_min_silence_ms: 600            # length of pause that ends a chunk
vad_speech_pad_ms: 300             # audio kept from before speech starts
max_chunk_s: 25.0                  # vad mode: a chunk this long is cut at its quietest point
continuous_chunk_s: 15.0           # continuous mode: chunk length (cut at the quietest point of its last 2 s)
compute_profile: "balanced"        # "accuracy": previews every 2 s (GPU always busy); "balanced": greedy previews every 4 s (~1/3 GPU); "saver": no previews, greedy decoding (~1/10 GPU)

# Speakers
speakers: true                     # label who is speaking (voice embeddings on the CPU); never changes the text
speaker_model: "wespeaker-voxceleb-resnet34-LM.onnx"   # in models_dir
speaker_threshold: 0.45            # voice similarity (0-1) needed to count as the same speaker

# Output
output_dir: "transcripts"          # default parent folder for new modules; relative to this file
save_audio: true                   # also save the 16 kHz mono recording as FLAC

# Obsidian notes: after each lecture Qwen summarises the transcript into the vault's lecture template
obsidian_vault: "G:/My Drive/main"            # "" = no notes
obsidian_template: "2 Templates/Lecture.md"   # relative to the vault
obsidian_modules: "1 Current/UZH"             # where new modules get their vault folder
obsidian_attachments: "Attachments"           # where the lecture recordings go, relative to the vault
llm_model: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"   # in models_dir
llama_server: "~/.venvs/llama.cpp/b12068/llama-server.exe"   # llama.cpp built for Vulkan
llm_context: 32768                 # tokens; longer lectures are summarised in parts first

# Window (docked to the right edge of the screen, top to bottom)
panel_width: 0.30                  # share of the screen width
background_opacity: 0.72           # 1.0 = solid; text always stays solid
